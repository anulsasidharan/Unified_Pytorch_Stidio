# Production overrides — usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Requires: SECRET_KEY (32+ chars), production DATABASE_URL, REDIS_URL

services:
  postgres:
    restart: always

  redis:
    restart: always

  backend:
    restart: always
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    environment:
      APP_ENV: production
      RUN_MIGRATIONS: "true"
      SEED_TOPICS: "false"
      SEED_QUESTIONS: "false"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      TUTOR_PROVIDER: ${TUTOR_PROVIDER:-auto}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes: []

  celery-worker:
    restart: always
    environment:
      APP_ENV: production
    volumes: []

  frontend:
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_PYODIDE_VERSION: ${NEXT_PUBLIC_PYODIDE_VERSION:-0.25.0}
    volumes: []
